[package]
name = "pilot-deck"
version = "0.1.0"
edition = "2024"
publish = false
description = "The deck's native client: a Rune window reading the daemon's view over loopback (ADR 0206)."

[[bin]]
name = "pilot-deck"
path = "src/main.rs"

[dependencies]
# Pinned by rev (L6): an upgrade is a ticket. `tooling` keeps `--snap` and `--tree` in release builds.
rune = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad", features = ["tooling"] }
# Bodies and messages are drawn as markdown by rune-kit's `Markdown`, never a port of markdown.mjs (L8).
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad", default-features = false, features = ["markdown"] }
# The reply box's preview parses with rune-kit's own parser, so it styles what the thread renders.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only: no TLS, no proxy, no redirects (spec 9); the client talks to loopback.
ureq = { version = "3", default-features = false, features = ["json"] }

# build.rs turns theme.json's space and motion into consts.
[build-dependencies]
serde_json = "1"

# Rune's own patches, copied from its README at the pinned rev: Cargo does not inherit them.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "7cba77c86b7c203bcf68c5ca539640cb81ec50ad" }
