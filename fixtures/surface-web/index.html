<!doctype html>
<!-- The web surface fixture (ui-design-workflow S1). Every colour and spacing is a CSS variable set
     from tokens.json; the screen is the URL's fragment (#home, #settings) and the mode is the
     browser's prefers-color-scheme. No network: the token file is read from beside this page, or
     arrives from the token playground by postMessage (S5). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surface fixture</title>
<style>
  body { margin: 0; background: var(--surface); color: var(--text); font: var(--font-size) var(--font-family); }
  header { display: flex; gap: var(--space-m); align-items: center; padding: var(--space-m) var(--space-l);
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 1.1em; margin: 0; flex: 1; }
  nav a { color: var(--muted); text-decoration: none; padding: var(--space-xs) var(--space-s); border-radius: var(--radius); }
  nav a[aria-current] { color: var(--on-accent); background: var(--accent); }
  main { padding: var(--space-l); display: grid; gap: var(--space-m); max-width: 720px; }
  main[hidden] { display: none; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-m); }
  section h2 { margin: 0 0 var(--space-s); font-size: 1em; }
  p { margin: 0; color: var(--muted); }
  button { font: inherit; color: var(--on-accent); background: var(--accent); border: 0; border-radius: var(--radius);
    padding: var(--space-s) var(--space-m); }
  label { display: flex; justify-content: space-between; align-items: center; padding: var(--space-s) 0;
    border-bottom: 1px solid var(--border); }
  #error { color: #b91c1c; background: #fff; padding: var(--space-m, 16px); font-family: monospace; }
</style>
</head>
<body>
<header>
  <h1>Surface fixture</h1>
  <nav><a href="#home">Home</a> <a href="#settings">Settings</a></nav>
</header>
<main id="home" hidden>
  <section><h2>Welcome</h2><p>A static page whose colours and spacing come from tokens.json.</p></section>
  <section><h2>Next step</h2><p>Shape the look, then send the export back.</p><br><button type="button">Open playground</button></section>
</main>
<main id="settings" hidden>
  <section>
    <h2>Settings</h2>
    <label>Theme <span>follows the system</span></label>
    <label>Density <span>comfortable</span></label>
  </section>
</main>
<div id="error" hidden></div>
<script>
  const kebab = (key) => key.replaceAll('_', '-');
  /** Each leaf becomes a CSS variable: a {light, dark} pair takes the mode's side; a number is pixels. */
  function apply(tokens, dark) {
    const style = document.documentElement.style;
    for (const [key, value] of Object.entries(tokens.color ?? {})) style.setProperty(`--${kebab(key)}`, dark ? value.dark : value.light);
    for (const [key, value] of Object.entries(tokens.space ?? {})) style.setProperty(`--space-${key}`, `${value}px`);
    style.setProperty('--radius', `${tokens.radius}px`);
    style.setProperty('--font-family', tokens.font?.family);
    style.setProperty('--font-size', `${tokens.font?.size}px`);
  }
  /**
   * The token playground (S5) frames this page and sends `{ tokens, dark }` by postMessage; anything
   * else, or from any other window, changes nothing. Its tokens win over the file read below.
   */
  function onTokens(event) {
    const data = event.data;
    if (event.source !== parent || !data || typeof data !== 'object') return;
    const { tokens, dark } = data;
    if (!tokens || typeof tokens !== 'object' || Array.isArray(tokens)) return;
    apply(tokens, dark === true);
    framed = true;
    document.getElementById('error').hidden = true;
    show();
  }
  addEventListener('message', onTokens);
  function show() {
    const screen = location.hash.slice(1) || 'home';
    for (const main of document.querySelectorAll('main')) main.hidden = main.id !== screen;
    for (const a of document.querySelectorAll('nav a')) a.toggleAttribute('aria-current', a.hash === `#${screen}`);
  }
  addEventListener('hashchange', show);
  // A framed page's file read is often blocked (file:// in a normal profile): the message is its tokens.
  let framed = false;
  fetch('tokens.json')
    .then((res) => res.json())
    .then((tokens) => { if (!framed) { apply(tokens, matchMedia('(prefers-color-scheme: dark)').matches); show(); } })
    .catch((err) => {
      if (framed) return;
      const box = document.getElementById('error');
      box.hidden = false;
      box.textContent = `tokens.json did not load: ${err.message}`;
    });
</script>
</body>
</html>
