name: Gate

# The project's full gate on every non-draft PR to main and every push to main (main-never-red L8), on
# ubuntu. macOS and Windows join for a PR labelled all-os (drafts included), the weekly schedule, a
# dispatch, or any non-draft PR once the repository is public (mac-linux L7, L10). A feature PR to
# pilot runs it too, drafts included (ci-cross-os L6), and so does a draft PR to main, whose green run a
# landing trusts for the tree each job names in its last step (cheap-suite A2, L7).
on:
  pull_request:
    branches: [main, 'feat/**', pilot]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, pilot]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'all-os') || github.base_ref == 'pilot' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'all-os')))) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # stay-awake S5: logind grants a sleep:idle inhibitor to a process in no login session, as the runner's
      # is, only with admin auth. This rule grants the two inhibit actions to the runner user on this CI
      # machine alone (the package ships no polkit file), and the flag makes the holder tests require it.
      - name: Grant the runner a logind inhibitor
        if: runner.os == 'Linux'
        shell: bash
        env:
          RULE: |
            polkit.addRule(function (action, subject) {
              if ((action.id == 'org.freedesktop.login1.inhibit-block-sleep' || action.id == 'org.freedesktop.login1.inhibit-block-idle') && subject.user == 'runner') return polkit.Result.YES;
            });
        run: echo "$RULE" | sudo tee /etc/polkit-1/rules.d/49-pilot-ci-inhibit.rules && echo PILOT_REQUIRE_LINUX_HOLDER=1 >> "$GITHUB_ENV"

      - name: Test suite
        run: npm test

      - name: Check references
        run: node scripts/check-references.mjs

      - name: Check provenance
        run: node scripts/check-provenance.mjs agents/ skills/ rules/

      # Last, so only a job whose every step passed names a tree; `provenTree` reads it back (cheap-suite L7).
      - name: Name the tested tree
        shell: bash
        run: echo "::notice title=tested-tree::$(git rev-parse 'HEAD^{tree}')"
