name: Gate

# The project's full gate on every non-draft PR to main and every push to main (main-never-red L8), on
# ubuntu. macOS and Windows join for a PR labelled all-os (drafts included), the weekly schedule, a
# dispatch, or any non-draft PR once the repository is public (mac-linux L7, L10).
on:
  pull_request:
    branches: [main, 'feat/**']
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'all-os')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.repository.private == false || contains(github.event.pull_request.labels.*.name, 'all-os')))) && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test suite
        run: npm test

      - name: Check references
        run: node scripts/check-references.mjs

      - name: Check provenance
        run: node scripts/check-provenance.mjs agents/ skills/ rules/
